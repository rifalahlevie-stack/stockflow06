<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockFlow User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .active-tab { color: #6366f1 !important; border-top: 3px solid #6366f1; }
    </style>
</head>
<body class="pb-24">
    <header class="bg-white px-6 py-6 border-b flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 id="pageTitle" class="text-xl font-black text-[#1b2559] uppercase">Semua Stok</h1>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[2px]">Logistik Center</p>
        </div>
        <button onclick="fetchCloudData()" class="bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center active:scale-90 transition-all">
            <i class="fas fa-sync-alt" id="refreshIcon"></i>
        </button>
    </header>

    <div class="p-4">
        <input type="text" id="userSearch" onkeyup="renderTable()" placeholder="Cari nama barang..." class="w-full bg-white border border-slate-100 rounded-2xl py-4 px-6 shadow-sm font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <main class="px-4" id="container"></main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center z-50 shadow-2xl">
        <button onclick="switchTab('all')" id="tabAll" class="flex flex-col items-center gap-1 py-4 px-6 active-tab">
            <i class="fas fa-boxes text-lg"></i> <span class="text-[10px] font-black uppercase">Semua Stok</span>
        </button>
        <button onclick="switchTab('pull')" id="tabPull" class="flex flex-col items-center gap-1 py-4 px-6 text-slate-400">
            <i class="fas fa-calendar-exclamation text-lg"></i> <span class="text-[10px] font-black uppercase">Daftar Tarik</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyIYZQLch3Jwf0hlS5mN7fxmO80oA-iTtru5ZhmCHWC969MNzQFOpjfBq689PSLuE1X6A/exec'; 
        let inventoryData = [], currentTab = 'all';

        function formatTglIndo(dateStr) {
            if (!dateStr || !dateStr.includes('-')) return dateStr;
            const bulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const bagian = dateStr.split('-');
            return `${parseInt(bagian[0])} ${bulanIndo[parseInt(bagian[1]) - 1]} ${bagian[2]}`;
        }

        function isNearExpired(dateStr) {
            if (!dateStr || !dateStr.includes('-')) return false;
            const [d, m, y] = dateStr.split('-');
            const expDate = new Date(y, m - 1, d);
            const diffDays = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
            return diffDays <= 90 && diffDays >= -1;
        }

        async function fetchCloudData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            try {
                const res = await fetch(API_URL + "?t=" + Date.now());
                const data = await res.json();
                inventoryData = data.inventory || [];
                renderTable();
            } catch (e) { console.error("Sync gagal"); }
            finally { icon.classList.remove('fa-spin'); }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('pageTitle').innerText = tab === 'all' ? 'Semua Stok' : 'Daftar Tarik';
            document.getElementById('tabAll').className = tab === 'all' ? "flex flex-col items-center gap-1 py-4 px-6 active-tab" : "flex flex-col items-center gap-1 py-4 px-6 text-slate-400";
            document.getElementById('tabPull').className = tab === 'pull' ? "flex flex-col items-center gap-1 py-4 px-6 active-tab" : "flex flex-col items-center gap-1 py-4 px-6 text-slate-400";
            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('container');
            const q = document.getElementById('userSearch').value.toLowerCase();
            container.innerHTML = "";

            let displayData = currentTab === 'pull' ? inventoryData.filter(i => isNearExpired(i.tgl_expired)) : inventoryData;
            displayData = displayData.filter(i => (i.produk || "").toLowerCase().includes(q));

            displayData.forEach(i => {
                const isWarning = isNearExpired(i.tgl_expired);
                container.innerHTML += `
                <div class="bg-white p-5 rounded-[30px] shadow-sm mb-4 border ${isWarning && currentTab === 'pull' ? 'border-rose-100 border-l-4 border-l-rose-500' : 'border-slate-50'}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <p class="text-[9px] font-black text-indigo-400 uppercase">#${i.item_id}</p>
                            <h4 class="font-bold text-[14px] uppercase text-slate-800 leading-tight">${i.produk}</h4>
                            <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">${i.vendor}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[8px] font-black text-slate-300 uppercase">Expired</p>
                            <p class="text-[11px] font-black ${isWarning ? 'text-rose-500' : 'text-emerald-500'}">${formatTglIndo(i.tgl_expired)}</p>
                        </div>
                    </div>
                    ${currentTab === 'pull' ? `
                    <div class="flex items-end gap-3 border-t pt-4">
                        <div class="flex-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Qty Fisik</label>
                            <input type="number" id="qty-${i.item_id}" placeholder="0" class="w-full bg-slate-50 p-3 rounded-xl font-bold text-sm outline-none border-none">
                        </div>
                        <button onclick="pullItem('${i.item_id}', '${i.tgl_expired}')" class="bg-rose-500 text-white px-6 py-3 rounded-xl text-[10px] font-black uppercase active:scale-95 transition-all">Tarik</button>
                    </div>` : ''}
                </div>`;
            });
        }

        async function pullItem(id, exp) {
            const qtyVal = document.getElementById(`qty-${id}`).value;
            if (!qtyVal || qtyVal <= 0) return alert("Isi jumlah fisik!");
            if(!confirm(`Tarik ${qtyVal} pcs barang?`)) return;
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'PULL_ITEM', item_id: id, tgl_expired: exp, qty: qtyVal }) });
                fetchCloudData();
            } catch (e) { alert("Gagal!"); }
        }

        fetchCloudData();
    </script>
</body>
</html>
