<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockFlow User - Area Penarikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .active-tab { color: #6366f1 !important; border-top: 3px solid #6366f1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- HEADER -->
    <header class="bg-white px-6 py-6 border-b flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div>
            <h1 id="pageTitle" class="text-xl font-black text-[#1b2559] uppercase tracking-tight">Semua Stok</h1>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[2px]">Area Operasional</p>
        </div>
        <button onclick="fetchCloudData()" class="bg-indigo-600 text-white w-10 h-10 rounded-xl shadow-lg flex items-center justify-center active:scale-90 transition-all">
            <i class="fas fa-sync-alt" id="refreshIcon"></i>
        </button>
    </header>

    <!-- SEARCH BAR -->
    <div class="p-4">
        <div class="relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input type="text" id="userSearch" onkeyup="renderTable()" placeholder="Cari nama barang..." class="w-full bg-white border border-slate-100 rounded-2xl py-4 pl-12 pr-4 shadow-sm font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="px-4 pb-10">
        <div id="container" class="grid grid-cols-1 gap-4">
            <!-- Data akan muncul di sini -->
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('all')" id="tabAll" class="flex flex-col items-center gap-1 py-4 px-6 active-tab">
            <i class="fas fa-boxes text-lg"></i>
            <span class="text-[10px] font-black uppercase">Semua Stok</span>
        </button>
        <button onclick="switchTab('pull')" id="tabPull" class="flex flex-col items-center gap-1 py-4 px-6 text-slate-400">
            <div class="relative">
                <i class="fas fa-calendar-exclamation text-lg"></i>
                <div id="notifBadge" class="hidden absolute -top-1 -right-2 w-4 h-4 bg-rose-500 border-2 border-white rounded-full"></div>
            </div>
            <span class="text-[10px] font-black uppercase">Daftar Tarik</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbw2n9HwBuhrHd7_FWF498_bbNj1W0Fhkys9Qr2n_SXUmYgx9IK4CLT3Cufg4G8ldjEXgA/exec';
        let inventoryData = [], currentTab = 'all';

        // Fungsi Hitung Selisih Bulan (Filter 3 Bulan)
        function isNearExpired(dateStr) {
            if (!dateStr || !dateStr.includes('-')) return false;
            
            const [d, m, y] = dateStr.split('-');
            const expDate = new Date(y, m - 1, d);
            const today = new Date();
            
            // Hitung selisih waktu dalam milidetik
            const diffTime = expDate - today;
            // Konversi ke hari (1000ms * 60s * 60m * 24h)
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            // Masuk daftar tarik jika Expired dalam 90 hari ke depan DAN belum lewat hari ini
            return diffDays <= 90 && diffDays >= -1;
        }

        async function fetchCloudData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            try {
                const res = await fetch(API_URL + "?t=" + Date.now());
                const data = await res.json();
                inventoryData = data.inventory || [];
                renderTable();
                checkBadge();
            } catch (e) { alert("Gagal Sinkron!"); }
            finally { icon.classList.remove('fa-spin'); }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('pageTitle').innerText = tab === 'all' ? 'Semua Stok' : 'Daftar Tarik';
            
            document.getElementById('tabAll').className = tab === 'all' ? "flex flex-col items-center gap-1 py-4 px-6 active-tab" : "flex flex-col items-center gap-1 py-4 px-6 text-slate-400";
            document.getElementById('tabPull').className = tab === 'pull' ? "flex flex-col items-center gap-1 py-4 px-6 active-tab" : "flex flex-col items-center gap-1 py-4 px-6 text-slate-400";
            
            renderTable();
        }

        function checkBadge() {
            const hasExpiring = inventoryData.some(i => isNearExpired(i.tgl_expired));
            document.getElementById('notifBadge').classList.toggle('hidden', !hasExpiring);
        }

        function renderTable() {
            const container = document.getElementById('container');
            const searchQ = document.getElementById('userSearch').value.toLowerCase();
            container.innerHTML = "";

            let displayData = inventoryData;

            // Logika Filter Tab
            if (currentTab === 'pull') {
                displayData = inventoryData.filter(i => isNearExpired(i.tgl_expired));
            }

            // Logika Search
            displayData = displayData.filter(i => (i.produk || "").toLowerCase().includes(searchQ));

            if (displayData.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-slate-300 font-bold italic">Tidak ada barang ditemukan</div>`;
                return;
            }

            displayData.forEach(i => {
                const isWarning = isNearExpired(i.tgl_expired);
                
                container.innerHTML += `
                <div class="bg-white p-5 rounded-[30px] shadow-sm border ${isWarning && currentTab === 'pull' ? 'border-rose-100 border-l-4 border-l-rose-500' : 'border-slate-50'} flex justify-between items-center transition-all">
                    <div class="flex-1">
                        <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest">#${i.item_id}</p>
                        <h4 class="font-bold text-[14px] uppercase text-slate-800 leading-tight">${i.produk}</h4>
                        <div class="flex gap-3 mt-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase"><i class="fas fa-store mr-1"></i>${i.vendor}</span>
                            <span class="text-[10px] font-bold ${isWarning ? 'text-rose-500' : 'text-emerald-500'} uppercase"><i class="fas fa-clock mr-1"></i>Exp: ${i.tgl_expired}</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <div class="bg-indigo-50 px-4 py-2 rounded-2xl text-center">
                            <p class="text-[8px] font-black text-indigo-400 uppercase">Stok</p>
                            <p class="text-lg font-black text-indigo-600">${i.stok}</p>
                        </div>
                        ${currentTab === 'pull' ? `
                        <button onclick="pullItem('${i.item_id}', '${i.tgl_expired}')" class="bg-rose-500 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg active:scale-95">Tarik</button>
                        ` : ''}
                    </div>
                </div>`;
            });
        }

        async function pullItem(id, exp) {
            if(!confirm("Barang sudah diambil dari rak?")) return;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'PULL_ITEM', item_id: id, tgl_expired: exp })
                });
                fetchCloudData();
            } catch (e) { alert("Gagal tarik barang!"); }
        }

        fetchCloudData();
    </script>
</body>
</html>
