<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .active-tab { background: #6366f1; color: white !important; transform: translateX(5px); }
        .section-fade { animation: fadeInSlide 0.4s ease-out forwards; }
        @keyframes fadeInSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-24 md:pb-0">
    <div class="flex flex-col md:flex-row h-screen">
        <!-- SIDEBAR -->
        <aside class="hidden md:flex w-72 bg-[#0b1437] text-white flex-col shadow-2xl z-20">
            <div class="p-8 border-b border-white/5 flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center"><i class="fas fa-warehouse"></i></div>
                <span class="text-xl font-black italic uppercase tracking-tighter">STOCKFLOW <span class="text-indigo-400">PRO</span></span>
            </div>
            <nav class="p-6 flex flex-col gap-3 flex-1">
                <button onclick="showSection('input')" id="btnInputDesk" class="p-4 rounded-2xl flex items-center gap-4 active-tab transition-all">
                    <i class="fas fa-edit text-sm"></i> <span class="font-bold text-[10px] uppercase">Input Gudang</span>
                </button>
                <button onclick="showSection('logs')" id="btnLogsDesk" class="p-4 rounded-2xl flex items-center gap-4 text-slate-400 hover:bg-white/5 transition-all">
                    <i class="fas fa-history text-sm"></i> <span class="font-bold text-[10px] uppercase">Laporan Retur</span>
                </button>
            </nav>
        </aside>

        <!-- MAIN -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white px-6 md:px-10 py-6 border-b flex justify-between items-center z-10 shadow-sm">
                <div>
                    <h2 id="sectionTitle" class="text-xl font-black text-[#1b2559] uppercase">Input Gudang</h2>
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[2px]">Logistik Center</p>
                </div>
                <div class="flex gap-2">
                    <button id="exportBtn" onclick="exportToExcel()" class="hidden bg-emerald-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase shadow-lg active:scale-90 transition-all">EXPORT</button>
                    <button onclick="fetchCloudData()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase shadow-lg active:scale-90 transition-all">
                        <i class="fas fa-sync-alt" id="refreshIcon"></i> SYNC
                    </button>
                </div>
            </header>

            <main id="mainView" class="p-4 md:p-10 overflow-y-auto section-fade">
                <div id="inputPanel" class="bg-white p-6 rounded-[30px] shadow-sm mb-6 border border-indigo-50">
                    <form id="warehouseForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="hidden" id="wVendorHidden">
                        <input type="text" id="wId" onkeyup="handleAutoFill()" placeholder="ID Barang..." class="bg-slate-50 p-4 rounded-2xl font-bold text-sm outline-none">
                        <input type="text" id="wNama" readonly placeholder="Nama Produk..." class="bg-slate-100 p-4 rounded-2xl font-bold text-sm text-indigo-600">
                        <input type="date" id="wExp" class="bg-slate-50 p-4 rounded-2xl font-bold text-sm outline-none">
                        <button type="submit" class="md:col-span-3 bg-[#0b1437] text-white py-4 rounded-2xl font-black uppercase text-[10px] shadow-xl hover:bg-indigo-600 transition-all">Simpan Ke Rak Aktif</button>
                    </form>
                </div>
                <div class="mb-6 relative">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="text" id="adminSearch" onkeyup="renderTable()" placeholder="Cari data..." class="w-full bg-white border-none rounded-2xl py-4 pl-14 pr-6 shadow-sm font-bold text-sm outline-none">
                </div>
                <div id="tableContainer"></div>
            </main>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyIYZQLch3Jwf0hlS5mN7fxmO80oA-iTtru5ZhmCHWC969MNzQFOpjfBq689PSLuE1X6A/exec'; 
        let inventoryData = [], logData = [], masterMap = new Map(), currentMode = 'input';

        function formatTglIndo(dateStr) {
            if (!dateStr || !dateStr.includes('-')) return dateStr;
            const bulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const bagian = dateStr.split('-');
            return `${parseInt(bagian[0])} ${bulanIndo[parseInt(bagian[1]) - 1]} ${bagian[2]}`;
        }

        async function fetchCloudData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            try {
                const res = await fetch(API_URL + "?t=" + Date.now());
                const data = await res.json();
                inventoryData = data.inventory || [];
                logData = data.logs || [];
                masterMap.clear();
                (data.master || []).forEach(m => masterMap.set(String(m.item_id).trim(), m));
                renderTable();
                Swal.fire({ icon: 'success', title: 'Data Terupdate', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
            } catch (e) { Swal.fire('Error', 'Gagal Sync', 'error'); }
            finally { icon.classList.remove('fa-spin'); }
        }

        function showSection(mode) {
            if(currentMode === mode) return;
            currentMode = mode;
            const mainView = document.getElementById('mainView');
            mainView.classList.remove('section-fade');
            void mainView.offsetWidth;
            mainView.classList.add('section-fade');
            document.getElementById('sectionTitle').innerText = mode === 'input' ? "Input Gudang" : "Laporan Retur";
            document.getElementById('inputPanel').classList.toggle('hidden', mode === 'logs');
            document.getElementById('exportBtn').classList.toggle('hidden', mode === 'input');
            document.getElementById('btnInputDesk').classList.toggle('active-tab', mode === 'input');
            document.getElementById('btnLogsDesk').classList.toggle('active-tab', mode === 'logs');
            renderTable();
        }

        function renderTable() {
    const container = document.getElementById('tableContainer');
    const q = document.getElementById('adminSearch').value.toLowerCase();
    container.innerHTML = "";

    // Wrapper grid agar tampilan konsisten
    let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;

    if (currentMode === 'input') {
        // --- MODE RAK AKTIF ---
        const filtered = inventoryData.filter(i => 
            (i.produk || "").toLowerCase().includes(q) || 
            (i.item_id || "").toString().toLowerCase().includes(q)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-300 font-bold italic">Barang tidak ditemukan di rak</div>`;
            return;
        }

        filtered.forEach(i => {
            html += `
            <div class="bg-white p-5 rounded-[30px] shadow-sm border border-slate-50 flex items-center gap-4 hover:shadow-md transition-all section-fade">
                <div class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-xl flex items-center justify-center">
                    <i class="fas fa-box text-sm"></i>
                </div>
                <div>
                    <p class="text-[8px] font-black text-indigo-400 uppercase tracking-widest">#${i.item_id}</p>
                    <h4 class="font-bold text-[12px] uppercase text-slate-800 leading-tight">${i.produk}</h4>
                    <p class="text-[9px] text-slate-400 font-bold uppercase">
                        ${i.vendor} | <span class="text-rose-400">${formatTglIndo(i.tgl_expired)}</span>
                    </p>
                </div>
            </div>`;
        });

    } else {
        // --- MODE LAPORAN RETUR ---
        const filteredLogs = logData.filter(l => 
            (l.produk || "").toLowerCase().includes(q) || 
            (l.item_id || "").toString().toLowerCase().includes(q)
        );

        if (filteredLogs.length === 0) {
            container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-300 font-bold italic">Laporan tidak ditemukan</div>`;
            return;
        }

        filteredLogs.forEach(l => {
            // DETEKSI QTY: Mengecek semua kemungkinan nama properti dari Google Sheets
            const qtyVal = l.qty || l.qty_fisik || l.jumlah || l.qty_fisik_expired || "0";
            
            html += `
            <div class="bg-white p-6 rounded-[30px] border border-rose-100 border-l-4 border-l-rose-500 shadow-sm flex justify-between items-center hover:shadow-md transition-all section-fade">
                <div class="flex-1">
                    <h4 class="font-bold text-[12px] uppercase text-slate-800 leading-tight">${l.produk}</h4>
                    <p class="text-[9px] font-black text-slate-400 uppercase">Vendor: ${l.vendor}</p>
                    <p class="text-[10px] font-bold text-rose-500 mt-1 italic">
                        Exp: ${formatTglIndo(l.tgl_expired)}
                    </p>
                    <div class="mt-2 flex items-center gap-2 text-slate-300">
                        <i class="fas fa-history text-[9px]"></i>
                        <p class="text-[8px] font-bold uppercase italic">${l.waktu_tarik || '-'}</p>
                    </div>
                </div>
                <div class="bg-rose-50 px-4 py-2 rounded-xl text-center min-w-[60px] ml-4">
                    <p class="text-[8px] font-black text-rose-400 uppercase">Qty</p>
                    <p class="text-xl font-black text-rose-600">${qtyVal}</p>
                </div>
            </div>`;
        });
    }

    container.innerHTML = html + `</div>`;
}
function handleAutoFill() {
    const idInput = document.getElementById('wId').value.trim(); // Trim spasi input
    const nameField = document.getElementById('wNama');
    const vendorField = document.getElementById('wVendorHidden');
    
    if (!idInput) { nameField.value = ""; return; }

    // Cari di Master Map dengan konversi string yang ketat
    let match = masterMap.get(idInput) || 
                inventoryData.find(i => String(i.item_id).trim() === idInput);
    
    if(match) {
        nameField.value = match.produk;
        vendorField.value = match.vendor || "Vendor Umum";
        nameField.classList.replace('bg-slate-100', 'bg-emerald-50');
    } else {
        nameField.value = "TIDAK TERDAFTAR";
        nameField.classList.replace('bg-emerald-50', 'bg-slate-100');
    }
}
        document.getElementById('warehouseForm').onsubmit = async (e) => {
            e.preventDefault();
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const p = { action: 'ADD', item_id: document.getElementById('wId').value, produk: document.getElementById('wNama').value, vendor: document.getElementById('wVendorHidden').value, tgl_expired: document.getElementById('wExp').value.split('-').reverse().join('-') };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(p) });
            Swal.fire({ icon: 'success', title: 'Berhasil!', timer: 1500, showConfirmButton: false });
            e.target.reset(); fetchCloudData();
        };

        async function exportToExcel() {
            const dataExport = logData.map(l => ({ "ID": l.item_id, "Produk": l.produk, "Qty": l.qty || "0", "Vendor": l.vendor, "Exp": l.tgl_expired, "Waktu": l.waktu_tarik }));
            const ws = XLSX.utils.json_to_sheet(dataExport), wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan");
            XLSX.writeFile(wb, `Laporan_${Date.now()}.xlsx`);
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'CLEAR_LOGS' }) });
            fetchCloudData();
        }

        fetchCloudData();
    </script>
</body>
</html>
